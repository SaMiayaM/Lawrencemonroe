<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 450" fill="none">
  <!-- Signature Arch Pill Frame from LM Shorts -->
  <rect x="15" y="15" width="170" height="420" rx="85" stroke="#FFFFFF" stroke-width="12" stroke-dasharray="1400" stroke-dashoffset="0" opacity="0.95" />
  <!-- Vertical "Lawrence" typography running inside pill -->
  <g transform="translate(100, 240) rotate(-90)">
    <text 
      x="0" 
      y="18" 
      text-anchor="middle" 
      fill="#FFFFFF" 
      font-family="'Space Grotesk', 'Anton', sans-serif" 
      font-size="64" 
      font-weight="800" 
      letter-spacing="4"
    >Lawrence</text>
  </g>
</svg>
