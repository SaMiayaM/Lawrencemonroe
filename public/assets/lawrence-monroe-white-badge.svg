<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;800&amp;family=Space+Grotesk:wght@700&amp;display=swap');
      .badge-text {
        font-family: 'Cormorant Garamond', 'Didot', 'Times New Roman', serif;
        font-size: 140px;
        font-weight: 800;
        letter-spacing: -1.5px;
        fill: #000000;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .reg-text {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Outer Pill Background: Solid White -->
  <rect x="15" y="15" width="940" height="270" rx="135" fill="#FFFFFF" />
  
  <!-- Outer Black Border Line -->
  <rect x="15" y="15" width="940" height="270" rx="135" stroke="#000000" stroke-width="26" />
  
  <!-- Inner White Gap & Inner Black Border -->
  <rect x="42" y="42" width="886" height="216" rx="108" fill="none" stroke="#000000" stroke-width="12" />
  
  <!-- "LawrenceMonroe" Bold Serif Text in Center -->
  <text x="485" y="150" class="badge-text">LawrenceMonroe</text>

  <!-- Registered Trademark Symbol (R) at Bottom Right -->
  <g transform="translate(972, 268)">
    <circle cx="0" cy="0" r="14" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="0" class="reg-text">R</text>
  </g>
</svg>
